version: 2
updates:
  # NuGet — VerseOps.App + VerseOps.UiTests
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      kiota:
        patterns:
          - "Microsoft.Kiota.*"
      microsoft-identity:
        patterns:
          - "Microsoft.Identity.*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
