name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write   # publish release assets
  id-token: write   # required for Azure Trusted Signing federated login (when configured)

jobs:
  build:
    name: Build, SBOM, and publish artifacts
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for deterministic Source Link

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VerseOps.sln

      - name: Build (Release, deterministic)
        env:
          CI: true
        run: dotnet build VerseOps.sln -c Release --no-restore --nologo

      - name: Publish (win-x64, framework-dependent)
        env:
          CI: true
        run: |
          dotnet publish VerseOps.App\VerseOps.App.csproj `
            -c Release -r win-x64 --self-contained false `
            -o publish\win-x64 --nologo

      - name: Generate CycloneDX SBOM
        run: |
          dotnet tool install --global CycloneDX --version 5.2.0
          dotnet CycloneDX VerseOps.sln -o sbom -fn sbom.cdx.json --json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom\sbom.cdx.json
          if-no-files-found: error

      - name: Compute SHA-256 of unsigned executable
        run: |
          $hash = (Get-FileHash publish\win-x64\VerseOps.App.exe -Algorithm SHA256).Hash
          "VerseOps.App.exe (unsigned) SHA-256: $hash" | Out-File publish\win-x64\SHA256SUMS.txt -Encoding utf8
          Get-Content publish\win-x64\SHA256SUMS.txt

      # ----------------------------------------------------------------
      # OPTIONAL: sign with Azure Trusted Signing.
      # Uncomment and configure secrets to enable.
      # See SIGNING.md for setup.
      # ----------------------------------------------------------------
      # - name: Azure login (federated)
      #   uses: azure/login@v2
      #   with:
      #     client-id:       ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #
      # - name: Sign EXE with Azure Trusted Signing
      #   uses: azure/trusted-signing-action@v0.5.1
      #   with:
      #     endpoint:                ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      #     trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      #     certificate-profile-name:     ${{ secrets.TRUSTED_SIGNING_PROFILE }}
      #     files-folder:                 publish\win-x64
      #     files-folder-filter:          exe
      #     file-digest:                  SHA256
      #     timestamp-rfc3161:            http://timestamp.acs.microsoft.com
      #     timestamp-digest:             SHA256

      - name: Zip release
        run: Compress-Archive -Path publish\win-x64\* -DestinationPath VerseOps.App-${{ github.ref_name }}-win-x64.zip

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: VerseOps.App-${{ github.ref_name }}-win-x64
          path: VerseOps.App-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VerseOps.App-${{ github.ref_name }}-win-x64.zip
            sbom\sbom.cdx.json
            publish\win-x64\SHA256SUMS.txt
          generate_release_notes: true
          draft: true
