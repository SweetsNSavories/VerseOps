name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write       # publish release assets
  id-token: write       # required for Azure Trusted Signing federated login (when configured)
  attestations: write   # actions/attest-build-provenance (supply-chain attestation)

jobs:
  build:
    name: Build, SBOM, and publish artifacts
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for deterministic Source Link

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VerseOps.sln

      - name: Build (Release, deterministic)
        env:
          CI: true
        run: dotnet build VerseOps.sln -c Release --no-restore --nologo

      - name: Publish (win-x64, framework-dependent)
        env:
          CI: true
        run: |
          dotnet publish VerseOps.App\VerseOps.App.csproj `
            -c Release -r win-x64 --self-contained false `
            -o publish\win-x64 --nologo

      # Self-contained single-file build — customers can run with NO .NET
      # runtime install. Larger (~150 MB zipped) but "download and run".
      - name: Publish (win-x64, self-contained single-file)
        env:
          CI: true
        run: |
          dotnet publish VerseOps.App\VerseOps.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish\win-x64-selfcontained --nologo

      - name: Generate CycloneDX SBOM
        run: |
          dotnet tool install --global CycloneDX --version 5.2.0
          dotnet CycloneDX VerseOps.sln -o sbom -fn sbom.cdx.json --json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom\sbom.cdx.json
          if-no-files-found: error

      - name: Compute SHA-256 of unsigned executables
        run: |
          $h1 = (Get-FileHash publish\win-x64\VerseOps.App.exe -Algorithm SHA256).Hash
          $h2 = (Get-FileHash publish\win-x64-selfcontained\VerseOps.App.exe -Algorithm SHA256).Hash
          @(
            "VerseOps.App.exe (framework-dependent, unsigned) SHA-256: $h1",
            "VerseOps.App.exe (self-contained,         unsigned) SHA-256: $h2"
          ) | Out-File publish\SHA256SUMS.txt -Encoding utf8
          Get-Content publish\SHA256SUMS.txt

      # ----------------------------------------------------------------
      # OPTIONAL: sign with Azure Trusted Signing.
      # Uncomment and configure secrets to enable.
      # See SIGNING.md for setup.
      # ----------------------------------------------------------------
      # - name: Azure login (federated)
      #   uses: azure/login@v2
      #   with:
      #     client-id:       ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #
      # - name: Sign EXE with Azure Trusted Signing
      #   uses: azure/trusted-signing-action@v0.5.1
      #   with:
      #     endpoint:                ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      #     trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      #     certificate-profile-name:     ${{ secrets.TRUSTED_SIGNING_PROFILE }}
      #     files-folder:                 publish\win-x64
      #     files-folder-filter:          exe
      #     file-digest:                  SHA256
      #     timestamp-rfc3161:            http://timestamp.acs.microsoft.com
      #     timestamp-digest:             SHA256

      # ----------------------------------------------------------------
      # MSIX packaging (unsigned developer preview). Customers can sideload
      # for cleaner per-user install / Add-Remove entry / clean uninstall,
      # but Windows will warn until the package is signed with a
      # publicly-trusted code-signing cert (planned via SignPath.io Foundation
      # for OSS once approved).
      # ----------------------------------------------------------------
      - name: Stage MSIX layout
        run: |
          $stage = 'publish\msix'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # Use the self-contained build so the MSIX runs on machines without
          # the .NET 10 Desktop Runtime pre-installed.
          Copy-Item -Recurse -Force publish\win-x64-selfcontained\* $stage\
          # MSIX visual assets live next to the EXE under Assets\MsixLogos\.
          $logoDest = Join-Path $stage 'Assets\MsixLogos'
          New-Item -ItemType Directory -Force -Path $logoDest | Out-Null
          Copy-Item -Force VerseOps.App\Assets\MsixLogos\*.png $logoDest\
          # Inject the four-part MSIX version from the git tag (v0.1.2 -> 0.1.2.0).
          $ver = '${{ github.ref_name }}'.TrimStart('v') + '.0'
          Write-Host "MSIX version: $ver"
          (Get-Content VerseOps.App\Package.appxmanifest -Raw) `
            -replace 'Version="0\.0\.0\.0"', "Version=`"$ver`"" `
            | Set-Content "$stage\AppxManifest.xml" -Encoding utf8

      - name: Pack MSIX
        run: |
          # MakeAppx.exe lives under different paths depending on which Windows
          # 10 SDK versions are pre-installed on the runner. Search broadly,
          # prefer the newest SDK that actually contains the tool.
          $candidates = @(
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\makeappx.exe"     -ErrorAction SilentlyContinue
            Get-ChildItem "${env:ProgramFiles}\Windows Kits\10\bin\*\x64\makeappx.exe"        -ErrorAction SilentlyContinue
          ) | Where-Object { $_ } | Sort-Object FullName -Descending
          if (-not $candidates -or $candidates.Count -eq 0) {
            Write-Host '--- Windows Kits layout ---'
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            throw 'makeappx.exe not found on runner.'
          }
          $makeAppx = $candidates[0].FullName
          Write-Host "Using: $makeAppx"
          $msix = "VerseOps.App-${{ github.ref_name }}-win-x64-unsigned.msix"
          & $makeAppx pack /d publish\msix /p $msix /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed with exit code $LASTEXITCODE" }
          Write-Host "Built: $msix ($((Get-Item $msix).Length) bytes)"

      - name: Zip release archives
        run: |
          Compress-Archive -Path publish\win-x64\* `
            -DestinationPath VerseOps.App-${{ github.ref_name }}-win-x64.zip
          Compress-Archive -Path publish\win-x64-selfcontained\* `
            -DestinationPath VerseOps.App-${{ github.ref_name }}-win-x64-selfcontained.zip

      - name: Upload framework-dependent archive
        uses: actions/upload-artifact@v4
        with:
          name: VerseOps.App-${{ github.ref_name }}-win-x64
          path: VerseOps.App-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error

      - name: Upload self-contained archive
        uses: actions/upload-artifact@v4
        with:
          name: VerseOps.App-${{ github.ref_name }}-win-x64-selfcontained
          path: VerseOps.App-${{ github.ref_name }}-win-x64-selfcontained.zip
          if-no-files-found: error

      - name: Upload MSIX archive
        uses: actions/upload-artifact@v4
        with:
          name: VerseOps.App-${{ github.ref_name }}-win-x64-unsigned-msix
          path: VerseOps.App-${{ github.ref_name }}-win-x64-unsigned.msix
          if-no-files-found: error

      # Generates a signed in-toto provenance attestation, cryptographically
      # tying each release artifact back to this exact workflow run + commit
      # SHA. Verifiable with `gh attestation verify <file> --repo SweetsNSavories/VerseOps`.
      # Free supply-chain signal; does NOT replace code signing for Windows trust.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            VerseOps.App-${{ github.ref_name }}-win-x64.zip
            VerseOps.App-${{ github.ref_name }}-win-x64-selfcontained.zip
            VerseOps.App-${{ github.ref_name }}-win-x64-unsigned.msix

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VerseOps.App-${{ github.ref_name }}-win-x64.zip
            VerseOps.App-${{ github.ref_name }}-win-x64-selfcontained.zip
            VerseOps.App-${{ github.ref_name }}-win-x64-unsigned.msix
            sbom\sbom.cdx.json
            publish\SHA256SUMS.txt
          generate_release_notes: true
          draft: true
